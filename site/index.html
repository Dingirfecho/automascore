<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutomaScore · ¿Qué tan automatizable es tu problema?</title>
<meta name="description" content="Contanos qué proceso te hace perder tiempo y te decimos qué tan automatizable es, con ejemplos de soluciones que AI-Q ya tiene funcionando.">
<link rel="canonical" href="https://automascore.com/">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="blueprint.css">
<style>
  .wrap{max-width:860px;margin:0 auto;padding:0 var(--aq-pad-page-x)}
  .hero{margin:48px 0 32px}
  .hero h1{font-size:clamp(32px,6vw,56px);line-height:1;letter-spacing:-.04em;margin:14px 0 14px;font-weight:500}
  .hero p{max-width:60ch;color:var(--aq-ink2);font-size:15px;margin:0}
  .brand-by{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--aq-ink3);margin-left:10px;align-self:flex-end;padding-bottom:3px}
  .badges{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
  .panel{margin-bottom:var(--aq-space-5)}
  .panel .textarea{min-height:150px;resize:vertical;line-height:1.55}
  .row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
  .btns{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .btns .select{width:auto;padding:11px 34px 11px 12px;font-size:12px}
  .btn svg{width:14px;height:14px;display:inline-block}
  .btn.mic.on{border-color:var(--aq-accent);color:var(--aq-accent)}
  .btn.mic.on .dot{display:inline-block;width:8px;height:8px;background:var(--aq-accent);animation:pulse 1s infinite}
  .btn.mic .dot{display:none}
  @keyframes pulse{50%{opacity:.2}}
  .count{font-size:11px;letter-spacing:.1em;color:var(--aq-ink3)}
  #micmsg{font-size:12px;color:var(--aq-ink2);margin:10px 0 0;min-height:1em}
  .chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 var(--aq-space-6)}
  .chips .kicker{margin-right:4px}
  .chip{cursor:pointer;font-family:var(--aq-font-mono);transition:all var(--aq-t-fast)}
  .chip:hover{background:var(--aq-ink);color:var(--aq-paper)}
  .recap{border-left:3px solid var(--aq-mute1);padding:2px 0 2px 14px;margin:0 0 18px;font-size:12px;color:var(--aq-ink2);white-space:pre-wrap;max-height:7.5em;overflow:auto}
  .q{font-family:var(--aq-font-display);font-size:20px;line-height:1.3;letter-spacing:-.02em;margin:0 0 16px}
  /* Estado "analizando" */
  .think .panel-header .accent{animation:pulse 1.2s infinite}
  .steps{list-style:none;margin:0 0 18px;padding:0}
  .steps li{display:flex;gap:12px;align-items:center;margin:0;padding:7px 0;font-size:13px;color:var(--aq-mute2);transition:color .2s}
  .panel-body .steps li{padding-left:0}.panel-body .steps li::before{content:none}
  .steps li i{width:14px;height:14px;border:1.5px solid currentColor;flex-shrink:0;position:relative}
  .steps li.done{color:var(--aq-ink)}
  .steps li.done i{background:var(--aq-success);border-color:var(--aq-success)}
  .steps li.done i::after{content:"";position:absolute;left:3px;top:0;width:4px;height:8px;border:solid var(--aq-paper);border-width:0 2px 2px 0;transform:rotate(45deg)}
  .steps li.now{color:var(--aq-ink)}
  .steps li.now i{border-color:var(--aq-accent);animation:pulse 1s infinite}
  .scan{height:6px;border:1.5px solid var(--aq-ink);position:relative;overflow:hidden}
  .scan::after{content:"";position:absolute;top:0;bottom:0;width:30%;background:var(--aq-accent);animation:scan 1.3s ease-in-out infinite}
  @keyframes scan{0%{left:-30%}100%{left:100%}}
  #out.busy{opacity:.45;pointer-events:none;transition:opacity .2s}
  /* Resultado */
  .score{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .score b{font-family:var(--aq-font-display);font-size:clamp(56px,12vw,88px);line-height:.9;letter-spacing:-.05em;font-weight:500}
  .score small{font-size:.35em;color:var(--aq-ink3);letter-spacing:0}
  .alta{color:var(--aq-success)}.media{color:var(--aq-warn)}.baja{color:var(--aq-accent)}
  .lvl{display:inline-block;border:2px solid currentColor;padding:3px 9px;font-size:11px;letter-spacing:.18em;text-transform:uppercase}
  .meter{height:12px;border:2px solid var(--aq-ink);margin:16px 0 14px;position:relative;background:repeating-linear-gradient(90deg,transparent 0 9.5%,var(--aq-grid-strong) 9.5% 10%)}
  .meter i{display:block;height:100%;background:currentColor}
  .res{font-size:14px;line-height:1.6;margin:0;color:var(--aq-ink)}
  .crit{display:grid;grid-template-columns:150px 1fr 24px;gap:12px;align-items:center;font-size:12px;margin:9px 0;text-transform:uppercase;letter-spacing:.08em}
  .cells{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
  .cells s{height:10px;border:1.5px solid var(--aq-ink);background:transparent;text-decoration:none}
  .cells s.on{background:var(--aq-ink)}
  .match{padding:14px 0;border-top:1.5px solid var(--aq-ink)}
  .match:first-child{border-top:0;padding-top:0}
  .match a{font-family:var(--aq-font-display);font-size:18px;font-weight:500;letter-spacing:-.02em;border-bottom:2px solid var(--aq-accent)}
  .match .label-tag{margin-left:10px;vertical-align:3px}
  .match p{margin:6px 0 0;font-size:12px;color:var(--aq-ink2)}
  .panel-body ul{margin:0;padding-left:0;list-style:none}
  .panel-body ul li{padding-left:22px;position:relative;font-size:13px}
  .panel-body ul li::before{content:'→';position:absolute;left:0;color:var(--aq-accent)}
  .cta{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0 0}
  .err{border:2px solid var(--aq-accent);color:var(--aq-accent);padding:14px 16px;font-size:13px;margin-bottom:var(--aq-space-5)}
  .note{font-size:11px;line-height:1.6;color:var(--aq-ink3);margin:0 0 8px;max-width:70ch}
  .note a{color:var(--aq-ink2);border-bottom:1px solid var(--aq-mute2)}
  @media(max-width:520px){.crit{grid-template-columns:1fr 90px 20px;gap:8px;font-size:11px}.brand-by{display:none}}
  @media (prefers-reduced-motion:reduce){.scan::after,.steps li.now i,.think .panel-header .accent{animation:none}}
  .site-nav{display:flex;align-items:center;gap:14px}
  .lang-switch-group{display:inline-flex;align-items:center;border:var(--aq-border-thin)}
  .lang-switch-opt{font-family:var(--aq-font-mono);font-size:var(--aq-fs-meta);text-transform:uppercase;letter-spacing:var(--aq-track-kicker);padding:6px 8px;background:var(--aq-paper);color:var(--aq-ink);cursor:pointer;border:0;border-right:var(--aq-border-thin);transition:all var(--aq-t-fast)}
  .lang-switch-opt:last-child{border-right:0}
  .lang-switch-opt:hover,.lang-switch-opt.active{background:var(--aq-ink);color:var(--aq-paper)}
  .lang-switch-opt.active{font-weight:600}
  @media(max-width:640px){.nav-sol{display:none}}
</style>
</head>
<body>

<header class="site-header">
  <div class="site-header-inner">
    <a class="brand" href="https://ai-q.fit">
      <svg class="brand-mark" viewBox="0 0 80 80" aria-hidden="true">
        <rect x="2" y="2" width="76" height="76" fill="none" stroke="#0A0A0A" stroke-width="2"/>
        <line x1="2" y1="40" x2="78" y2="40" stroke="#0A0A0A" stroke-width="1"/>
        <line x1="40" y1="2" x2="40" y2="78" stroke="#0A0A0A" stroke-width="1"/>
        <circle cx="40" cy="40" r="18" fill="none" stroke="#FF3D00" stroke-width="2"/>
        <circle cx="40" cy="40" r="4" fill="#FF3D00"/>
      </svg>
      <span class="brand-wordmark">ai—q.fit<span class="slash">/</span></span>
    </a>
    <nav class="site-nav">
      <a class="nav-link nav-sol" id="navsol" href="https://ai-q.fit/soluciones.html" data-i18n="nav_sol">Soluciones</a>
      <a class="btn primary" id="navcta" href="https://calendly.com/dingirfecho/ai-strategy-discovery-call" target="_blank" rel="noopener" data-i18n="nav_cta">Agendá una llamada</a>
      <span class="lang-switch-group" id="uilang" role="group" aria-label="Idioma / Language">
        <button type="button" class="lang-switch-opt" data-l="es">ES</button>
        <button type="button" class="lang-switch-opt" data-l="en">EN</button>
        <button type="button" class="lang-switch-opt" data-l="pt">PT</button>
      </span>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="spec-strip spec-strip-top">
    <div class="spec-strip-group"><span>DOC // AIQ-SCORE-001</span><span class="mute2">REV / A</span></div>
    <div class="spec-strip-group"><span><span class="dot">●</span>AUTOMASCORE</span></div>
  </div>

  <section class="hero">
    <span class="kicker" data-i18n="kicker"></span>
    <h1 class="display" data-i18n="h1"></h1>
    <p data-i18n="hero"></p>
    <div class="badges"><span class="label-tag accent" data-i18n="free"></span><span class="label-tag" data-i18n="nodata"></span></div>
  </section>

  <section class="panel" id="p1">
    <div class="panel-header"><span><span class="accent">01</span> / <span data-i18n="p1"></span></span><span class="count" id="c">0 / 2000</span></div>
    <div class="panel-body">
      <textarea id="t" class="textarea" maxlength="2000" data-i18n-ph="ph"></textarea>
      <div class="row">
        <div class="btns">
          <select id="lang" class="select" hidden data-i18n-aria="dict_lang">
            <option value="es-AR" selected>ES</option>
            <option value="en-US">EN</option>
            <option value="pt-BR">PT</option>
          </select>
          <button id="mic" class="btn mic" type="button" hidden aria-pressed="false">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="5.5" y="1.5" width="5" height="8" /><path d="M3 7.5a5 5 0 0010 0M8 12.5v2"/></svg>
            <span class="dot"></span><span class="lbl"></span>
          </button>
        </div>
        <button id="go" class="btn primary" type="button" data-i18n="go"></button>
      </div>
      <p id="micmsg" aria-live="polite"></p>
    </div>
  </section>

  <div class="chips">
    <span class="kicker" data-i18n="try"></span>
    <button class="chip" type="button" data-ex="1"><span class="chip-dot"></span><span class="lbl"></span></button>
    <button class="chip" type="button" data-ex="2"><span class="chip-dot"></span><span class="lbl"></span></button>
    <button class="chip" type="button" data-ex="3"><span class="chip-dot"></span><span class="lbl"></span></button>
  </div>

  <div id="out" aria-live="polite"></div>
  <div id="think" aria-live="polite"></div>

  <p class="note" data-i18n="note1"></p>
  <p class="note" data-i18n="note2"></p>

  <div class="spec-strip spec-strip-bottom">
    <div class="spec-strip-group"><span>© AI-Q Consultores SAS</span></div>
    <div class="spec-strip-group"><span><a href="https://ai-q.fit">ai-q.fit</a></span></div>
  </div>
</main>

<script>window.AS_CFG = {brand: "aiq"};</script>
<script src="/app.js"></script>
</body>
</html>
