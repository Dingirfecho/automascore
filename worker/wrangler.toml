name = "automascore-api"
main = "worker.js"
compatibility_date = "2026-11-01"

# El Worker responde en api.automascore.com (el dominio debe estar en tu cuenta de Cloudflare).
routes = [
  { pattern = "api.automascore.com", custom_domain = true }
]

# Límite por IP (opcional, recomendado). Verificá la sintaxis vigente en la documentación
# de Cloudflare "Workers Rate Limiting" antes de descomentar:
# [[ratelimits]]
# name = "LIMITER"
# namespace_id = "1001"
# simple = { limit = 10, period = 60 }
