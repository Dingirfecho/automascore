name = "automascore-api"
main = "worker.js"
compatibility_date = "2026-11-01"

# El Worker responde en api.automascore.com (el dominio debe estar en tu cuenta de Cloudflare).
routes = [
  { pattern = "api.automascore.com", custom_domain = true }
]

# Límite de consultas por IP (requiere Wrangler 4.36 o superior).
# period solo admite 10 o 60 segundos. El límite es por ubicación de Cloudflare y aproximado:
# frena el abuso casual, no es un tope global. El tope real de gasto es el spend limit del
# Workspace en la consola de Anthropic.
[[ratelimits]]
name = "LIMITER"
namespace_id = "7421"

[ratelimits.simple]
limit = 6
period = 60
